name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to base `main` meant a
  # stacked PR - one refactor phase targeting the previous phase's branch - got no
  # CI run at all, silently, which defeats the point of the gate.
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  requirements-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.29"

      - name: Regenerate backend requirements from the lockfile
        run: >-
          uv export --no-dev --no-hashes --no-emit-project
          --format requirements.txt -o backend/requirements.txt

      - name: Fail if the committed export has drifted
        run: git diff --exit-code -- backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
