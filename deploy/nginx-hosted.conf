# G6 smoke: one URL in front of two API instances, round-robin. X-Served-By
# names the instance that answered, on every status code, so the smoke test can
# prove both instances refused history.
upstream meal_planner_api {
    server api-1:8000;
    server api-2:8000;
}

server {
    listen 8080;

    location / {
        proxy_pass http://meal_planner_api;
        proxy_set_header Host $host;
        add_header X-Served-By $upstream_addr always;
    }
}
