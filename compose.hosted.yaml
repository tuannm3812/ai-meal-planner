# G6: a hosted-mode deployment rehearsal. Two API instances, each with its own
# instance-local storage, behind one URL - the shape of Cloud Run or any
# multi-instance host. Used by scripts/hosted_smoke.sh; not a production
# deployment. API_KEYS is required, because APP_ENV=production refuses to start
# without keys (DEC-8).
name: ai-meal-planner-hosted

x-api: &api
  image: ${MEAL_PLANNER_IMAGE:-ai-meal-planner:local}
  environment:
    APP_ENV: production
    HOSTED_MODE: "true"
    STORAGE_BACKEND: sqlite
    API_KEYS: ${API_KEYS:?API_KEYS must be set for a hosted rehearsal}
    REQUIRE_VERIFIED_NUTRITION: "0"

services:
  api-1:
    <<: *api
    build: .
  api-2:
    <<: *api
    depends_on:
      api-1:
        condition: service_healthy
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx-hosted.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HOSTED_PORT:-8080}:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
