<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Previews</title>
<style>
:root{--bg:#fff;--ink:#15291F;--muted:#4B5B52;--line:#DDE3DA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15291F;--ink:#fff;--muted:#C9D3CC;--line:#35493E}}
:root[data-theme="dark"]{--bg:#15291F;--ink:#fff;--muted:#C9D3CC;--line:#35493E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px 16px}
main{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 20px}
h2{font-size:16px;margin:24px 0 8px}
img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
<h1>AI Meal Planner slide previews</h1>
<p>Latest previews for review. These are not yet in the live deck.</p>
<h2>Slide 2. Executive summary</h2>
<img src="slide-02.png" alt="Slide 2: four plates of chicken fried rice sized from 363 to 850 kcal, four feature cards and four proof numbers">
<h2>Slide 3. Agenda</h2>
<img src="slide-03.png" alt="Slide 3: a four-course menu agenda listing each page by label, beside a plate of salmon and quinoa">
<h2>Slide 4. Why it matters</h2>
<img src="slide-04.png" alt="Slide 4: a speech bubble over a pasta plate, beside three question cards">
<h2>Slide 5. The flow</h2>
<img src="slide-05.png" alt="Slide 5: three app screens in coloured step cards">
<h2>Slide 6. Four agents</h2>
<img src="slide-06.png" alt="Slide 6: an order ticket feeding four kitchen stations">
</main>
</body>
</html>
