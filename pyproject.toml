[project]
name = "ai-meal-planner"
version = "0.1.0"
description = "Backend-first AI meal planner with calorie prediction and local meal RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "google-genai",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  # G10b: the API alone is a no-op until an SDK is configured (the tracing extra).
  "opentelemetry-api>=1.45,<2",
  "pandas>=2.2,<3",
  "pydantic",
  "pydantic-settings>=2.15.0",
  "python-dotenv",
  "requests",
  "scikit-learn==1.6.1",
  "sqlmodel>=0.0.42",
  "streamlit",
  "uvicorn",
]

[project.optional-dependencies]
semantic-rag = [
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3,<4",
]
# G10b: export allowlisted spans to Cloud Trace over OTLP (TRACING_EXPORTER).
tracing = [
  "google-auth>=2.40,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
  # The tracing extra's SDK and exporter, so tests capture and encode spans
  # without needing --extra tracing.
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "ruff==0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Notebooks are Kaggle run artifacts, not living source: their committed cell
# outputs are the only surviving record of a run (master standard §12.1), so the
# source must keep matching what produced them (§4). Reformatting them breaks
# that correspondence, so ruff does not touch them.
# Markdown is excluded because ruff formats Python code blocks inside it as if
# each were a standalone module. Spec and plan documents quote *fragments* - a
# method shown at its class indentation, a partial call site - so formatting them
# that way is wrong, not just noisy: ruff dedents methods out of their class.
extend-exclude = ["*.ipynb", "*.md"]
# force-exclude so an explicitly-named path cannot bypass the rules above.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["backend/tests", "streamlit_app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --cov=backend/app --cov-report=term-missing"
markers = ["allow_network: test may open real network connections"]
